name: unipar_trilha_app
description: "Frontend Flutter do sistema Unipar Trilha."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  font_awesome_flutter: ^11.0.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Ativos de produção do kit Unipar Trail Code (FE-002).
  # Referências e pranchas de conferência não são empacotadas.
  assets:
    - assets/images/icons/
    - assets/images/icons/colored/
    - assets/images/illustrations/
    - assets/images/mascot/
    - assets/images/decorative/

  # Fontes OFL (Google Fonts) equivalentes às usadas nos wireframes.
  # SF Pro Display → Inter; Code Pro e Canva Sans → Montserrat.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
    - family: Montserrat
      fonts:
        - asset: assets/fonts/montserrat/Montserrat-Regular.ttf
        - asset: assets/fonts/montserrat/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/montserrat/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/montserrat/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/montserrat/Montserrat-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/montserrat/Montserrat-Black.ttf
          weight: 900
    - family: OpenSans
      fonts:
        - asset: assets/fonts/opensans/OpenSans-Regular.ttf
        - asset: assets/fonts/opensans/OpenSans-SemiBold.ttf
          weight: 600
    - family: FiraCode
      fonts:
        - asset: assets/fonts/firacode/FiraCode-Regular.ttf
        - asset: assets/fonts/firacode/FiraCode-SemiBold.ttf
          weight: 600
    - family: Fredoka
      fonts:
        - asset: assets/fonts/fredoka/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/fredoka/Fredoka-SemiBold.ttf
          weight: 600
